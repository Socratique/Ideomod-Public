<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Painter 16×16</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --accent2: #ff6b6b;
    --text: #eaeaea;
    --text-dim: #8892a4;
    --grid-line: rgba(255,255,255,0.08);
    --pixel-size: 28px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    background-image:
      radial-gradient(circle at 20% 50%, rgba(233,69,96,0.05) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(15,52,96,0.3) 0%, transparent 50%);
  }

  h1 {
    font-family: 'Silkscreen', cursive;
    font-size: 28px;
    color: var(--accent);
    margin-bottom: 4px;
    text-shadow: 0 0 20px rgba(233,69,96,0.4);
    letter-spacing: 2px;
  }

  .subtitle {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 20px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .app {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* ── Toolbar ── */
  .toolbar {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 56px;
    align-items: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }

  .tool-btn {
    width: 38px;
    height: 38px;
    border: 2px solid transparent;
    border-radius: 8px;
    background: var(--surface2);
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    position: relative;
  }

  .tool-btn:hover {
    background: rgba(233,69,96,0.15);
    color: var(--text);
    transform: scale(1.05);
  }

  .tool-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(233,69,96,0.12);
    box-shadow: 0 0 12px rgba(233,69,96,0.2);
  }

  .tool-btn .tooltip {
    position: absolute;
    left: 48px;
    background: #222;
    color: #fff;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 10px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 10;
  }

  .tool-btn:hover .tooltip { opacity: 1; }

  .divider {
    width: 28px;
    height: 1px;
    background: rgba(255,255,255,0.08);
    margin: 4px 0;
  }

  /* ── Canvas Area ── */
  .canvas-wrap { position: relative; }

  .canvas-container {
    display: grid;
    grid-template-columns: repeat(16, var(--pixel-size));
    grid-template-rows: repeat(16, var(--pixel-size));
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 0 1px rgba(233,69,96,0.3);
    background: repeating-conic-gradient(#2a2a3e 0% 25%, #252538 0% 50%) 0 0 / calc(var(--pixel-size)*2) calc(var(--pixel-size)*2);
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
  }

  .pixel {
    width: var(--pixel-size);
    height: var(--pixel-size);
    border: 0.5px solid var(--grid-line);
    transition: none;
    position: relative;
  }

  .pixel:hover {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    z-index: 1;
  }

  .canvas-coords {
    position: absolute;
    bottom: -22px;
    right: 0;
    font-size: 10px;
    color: var(--text-dim);
  }

  /* ── Right Panel ── */
  .panel {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 220px;
  }

  .panel-section {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }

  .panel-label {
    font-family: 'Silkscreen', cursive;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  /* Color */
  .color-current {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .color-preview {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    border: 2px solid rgba(255,255,255,0.15);
    box-shadow: 0 0 8px rgba(0,0,0,0.3);
  }

  .color-hex {
    font-size: 12px;
    color: var(--text);
    font-weight: 600;
  }

  input[type="color"] {
    width: 100%;
    height: 32px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
    padding: 0;
  }

  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch {
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
  }

  /* Palette */
  .palette {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 3px;
  }

  .swatch {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 3px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s, border-color 0.1s;
  }

  .swatch:hover { transform: scale(1.15); z-index: 1; }
  .swatch.active { border-color: #fff; }

  /* Export / Import */
  .export-section { display: flex; flex-direction: column; gap: 8px; }

  .filename-input {
    width: 100%;
    padding: 7px 10px;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    outline: none;
    transition: border-color 0.2s;
  }

  .filename-input:focus { border-color: var(--accent); }

  .export-btn, .import-btn {
    padding: 9px 12px;
    border: none;
    border-radius: 8px;
    font-family: 'Silkscreen', cursive;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
    width: 100%;
  }

  .export-btn { background: var(--accent); color: #fff; }
  .export-btn:hover {
    background: var(--accent2);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(233,69,96,0.35);
  }

  .import-btn {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .import-btn:hover {
    background: rgba(41,173,255,0.2);
    border-color: #29adff;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(41,173,255,0.2);
  }

  .drop-zone {
    border: 2px dashed rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    transition: all 0.2s;
    cursor: pointer;
  }
  .drop-zone.drag-over {
    border-color: #29adff;
    background: rgba(41,173,255,0.1);
    color: #29adff;
  }

  .size-info {
    font-size: 9px;
    color: var(--text-dim);
    text-align: center;
  }

  /* Toggles */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-dim);
  }

  .toggle {
    width: 34px;
    height: 18px;
    background: var(--bg);
    border-radius: 9px;
    cursor: pointer;
    position: relative;
    border: 1px solid rgba(255,255,255,0.1);
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle.on { background: var(--accent); border-color: var(--accent); }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 12px; height: 12px;
    background: #fff;
    border-radius: 50%;
    transition: left 0.15s;
  }
  .toggle.on::after { left: 18px; }

  .status-bar {
    margin-top: 12px;
    font-size: 10px;
    color: var(--text-dim);
    text-align: center;
    min-height: 16px;
    letter-spacing: 1px;
  }

  .shortcuts {
    font-size: 9px;
    color: var(--text-dim);
    line-height: 1.8;
    opacity: 0.7;
  }
  .shortcuts kbd {
    background: var(--bg);
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.1);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
  }

  /* ══════════════════════════════
     LAYERS PANEL
     ══════════════════════════════ */
  .layers-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .layers-header .panel-label { margin-bottom: 0; }

  .layer-actions {
    display: flex;
    gap: 4px;
  }

  .layer-action-btn {
    width: 24px; height: 24px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 5px;
    background: var(--surface2);
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    padding: 0;
    line-height: 1;
  }
  .layer-action-btn:hover {
    background: rgba(233,69,96,0.2);
    color: var(--text);
    border-color: var(--accent);
  }

  .layer-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 260px;
    overflow-y: auto;
  }

  .layer-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 7px;
    border-radius: 6px;
    background: var(--bg);
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.12s;
    min-height: 34px;
  }
  .layer-item:hover { background: rgba(255,255,255,0.03); }
  .layer-item.active {
    border-color: var(--accent);
    background: rgba(233,69,96,0.08);
  }

  .layer-visibility {
    width: 20px; height: 20px;
    border: none; background: none;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    transition: all 0.1s;
  }
  .layer-visibility:hover { background: rgba(255,255,255,0.08); }
  .layer-visibility.hidden { opacity: 0.3; }

  .layer-thumb {
    width: 24px; height: 24px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.1);
    image-rendering: pixelated;
    flex-shrink: 0;
    background: repeating-conic-gradient(#333 0% 25%, #444 0% 50%) 0 0 / 8px 8px;
  }

  .layer-name {
    flex: 1;
    font-size: 10px;
    color: var(--text);
    background: none;
    border: none;
    outline: none;
    font-family: 'JetBrains Mono', monospace;
    min-width: 0;
    padding: 2px 4px;
    border-radius: 3px;
    transition: background 0.1s;
  }
  .layer-name:focus { background: rgba(255,255,255,0.08); }

  .layer-order-btns {
    display: flex;
    flex-direction: column;
    gap: 1px;
    flex-shrink: 0;
  }

  .layer-order-btn {
    width: 16px; height: 13px;
    border: none; background: none;
    color: var(--text-dim);
    font-size: 8px;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
    transition: all 0.1s;
  }
  .layer-order-btn:hover {
    background: rgba(255,255,255,0.1);
    color: var(--text);
  }

  .layer-opacity-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    padding: 6px 8px;
    background: var(--bg);
    border-radius: 6px;
  }

  .layer-opacity-row label {
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    flex-shrink: 0;
    font-family: 'Silkscreen', cursive;
  }

  .opacity-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.1);
    outline: none;
    cursor: pointer;
  }
  .opacity-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 0 4px rgba(0,0,0,0.4);
  }
  .opacity-slider::-moz-range-thumb {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid #fff;
  }

  .opacity-value {
    font-size: 10px;
    color: var(--text);
    width: 32px;
    text-align: right;
    font-weight: 600;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<h1>PIXEL PAINTER</h1>
<p class="subtitle">16 × 16 editor</p>

<div class="app">
  <!-- Toolbar -->
  <div class="toolbar">
    <button class="tool-btn active" data-tool="pen" title="Pen">
      ✏️<span class="tooltip">Pen (B)</span>
    </button>
    <button class="tool-btn" data-tool="eraser" title="Eraser">
      🧹<span class="tooltip">Eraser (E)</span>
    </button>
    <button class="tool-btn" data-tool="fill" title="Fill">
      🪣<span class="tooltip">Fill (G)</span>
    </button>
    <button class="tool-btn" data-tool="eyedropper" title="Eyedropper">
      💧<span class="tooltip">Pick Color (I)</span>
    </button>
    <button class="tool-btn" data-tool="line" title="Line">
      📐<span class="tooltip">Line (L)</span>
    </button>
    <button class="tool-btn" data-tool="rect" title="Rectangle">
      ⬜<span class="tooltip">Rect (R)</span>
    </button>
    <div class="divider"></div>
    <button class="tool-btn" id="undoBtn" title="Undo">
      ↩️<span class="tooltip">Undo (Ctrl+Z)</span>
    </button>
    <button class="tool-btn" id="redoBtn" title="Redo">
      ↪️<span class="tooltip">Redo (Ctrl+Y)</span>
    </button>
    <div class="divider"></div>
    <button class="tool-btn" id="clearBtn" title="Clear">
      🗑️<span class="tooltip">Clear Layer</span>
    </button>
  </div>

  <!-- Canvas -->
  <div class="canvas-wrap">
    <div class="canvas-container" id="canvas"></div>
    <div class="canvas-coords" id="coords">—</div>
  </div>

  <!-- Right Panel -->
  <div class="panel">
    <!-- Color -->
    <div class="panel-section">
      <div class="panel-label">Color</div>
      <div class="color-current">
        <div class="color-preview" id="colorPreview"></div>
        <span class="color-hex" id="colorHex">#000000</span>
      </div>
      <input type="color" id="colorPicker" value="#000000">
    </div>

    <!-- Palette -->
    <div class="panel-section">
      <div class="panel-label">Palette</div>
      <div class="palette" id="palette"></div>
    </div>

    <!-- Layers -->
    <div class="panel-section">
      <div class="layers-header">
        <div class="panel-label">Layers</div>
        <div class="layer-actions">
          <button class="layer-action-btn" id="addLayerBtn" title="Add Layer">+</button>
          <button class="layer-action-btn" id="dupeLayerBtn" title="Duplicate Layer">⧉</button>
          <button class="layer-action-btn" id="mergeLayerBtn" title="Merge Down">⤓</button>
          <button class="layer-action-btn" id="deleteLayerBtn" title="Delete Layer">×</button>
        </div>
      </div>
      <div class="layer-list" id="layerList"></div>
      <div class="layer-opacity-row">
        <label>Opacity</label>
        <input type="range" class="opacity-slider" id="opacitySlider" min="0" max="100" value="100">
        <span class="opacity-value" id="opacityValue">100%</span>
      </div>
    </div>

    <!-- Settings -->
    <div class="panel-section">
      <div class="toggle-row">
        <span>Grid lines</span>
        <div class="toggle on" id="gridToggle"></div>
      </div>
    </div>

    <!-- Import -->
    <div class="panel-section export-section">
      <div class="panel-label">Import</div>
      <input type="file" id="importFile" accept="image/*" style="display:none">
      <button class="import-btn" id="importBtn">⬆ LOAD IMAGE</button>
      <div class="drop-zone" id="dropZone">or drag & drop here</div>
      <div class="size-info">Imports to active layer</div>
    </div>

    <!-- Export -->
    <div class="panel-section export-section">
      <div class="panel-label">Export PNG</div>
      <input type="text" class="filename-input" id="filename" value="sprite" placeholder="filename">
      <button class="export-btn" id="exportBtn">⬇ DOWNLOAD</button>
      <div class="size-info">Flattens all layers → 16×16 PNG</div>
    </div>

    <!-- Shortcuts -->
    <div class="panel-section">
      <div class="panel-label">Keys</div>
      <div class="shortcuts">
        <kbd>B</kbd> Pen · <kbd>E</kbd> Eraser<br>
        <kbd>G</kbd> Fill · <kbd>I</kbd> Pick<br>
        <kbd>L</kbd> Line · <kbd>R</kbd> Rect<br>
        <kbd>Ctrl+Z</kbd> Undo<br>
        <kbd>Ctrl+Y</kbd> Redo
      </div>
    </div>
  </div>
</div>

<div class="status-bar" id="status"></div>

<script>
  // ════════════════════════════════════════
  //  STATE
  // ════════════════════════════════════════
  const GRID = 16;
  let currentColor = '#000000';
  let currentTool = 'pen';
  let isDrawing = false;
  let lineStart = null;
  let rectStart = null;
  let previewPixels = [];

  // ── Layer System ──
  let layerIdCounter = 0;
  let layers = [];       // index 0 = top, last = bottom
  let activeLayerId = null;
  let undoStack = [];
  let redoStack = [];

  function makeEmptyGrid() {
    return Array.from({length: GRID}, () => Array(GRID).fill(null));
  }

  function createLayer(name, gridData) {
    const id = ++layerIdCounter;
    return { id, name: name || ('Layer ' + id), grid: gridData || makeEmptyGrid(), opacity: 1, visible: true };
  }

  // Start with one layer
  const firstLayer = createLayer('Background');
  layers = [firstLayer];
  activeLayerId = firstLayer.id;

  function activeLayer() { return layers.find(l => l.id === activeLayerId); }
  function activeGrid() { return activeLayer().grid; }

  // Deep-clone state for undo
  function cloneState() {
    return {
      layers: layers.map(l => ({ ...l, grid: l.grid.map(r => [...r]) })),
      activeLayerId
    };
  }

  function restoreState(state) {
    layers = state.layers.map(l => ({ ...l, grid: l.grid.map(r => [...r]) }));
    activeLayerId = state.activeLayerId;
    if (!layers.find(l => l.id === activeLayerId)) activeLayerId = layers[0].id;
    renderLayerList();
    compositeAll();
  }

  function saveState() {
    undoStack.push(cloneState());
    if (undoStack.length > 50) undoStack.shift();
    redoStack = [];
  }

  function undo() {
    if (!undoStack.length) return;
    redoStack.push(cloneState());
    restoreState(undoStack.pop());
    showStatus('Undo');
  }

  function redo() {
    if (!redoStack.length) return;
    undoStack.push(cloneState());
    restoreState(redoStack.pop());
    showStatus('Redo');
  }

  // ════════════════════════════════════════
  //  CANVAS
  // ════════════════════════════════════════
  const canvasEl = document.getElementById('canvas');
  const pixelEls = [];

  for (let y = 0; y < GRID; y++) {
    pixelEls[y] = [];
    for (let x = 0; x < GRID; x++) {
      const div = document.createElement('div');
      div.className = 'pixel';
      div.dataset.x = x;
      div.dataset.y = y;
      canvasEl.appendChild(div);
      pixelEls[y][x] = div;
    }
  }

  // ════════════════════════════════════════
  //  COMPOSITING  (alpha blend all layers)
  // ════════════════════════════════════════
  function compositeAll() {
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++)
        pixelEls[y][x].style.background = compositeAt(x, y) || '';
    updateThumbnails();
  }

  function compositeAt(x, y) {
    let r = 0, g = 0, b = 0, a = 0;
    // bottom-to-top: last index is bottom
    for (let i = layers.length - 1; i >= 0; i--) {
      const L = layers[i];
      if (!L.visible || !L.grid[y][x]) continue;
      const hex = L.grid[y][x];
      const lr = parseInt(hex.slice(1,3),16);
      const lg = parseInt(hex.slice(3,5),16);
      const lb = parseInt(hex.slice(5,7),16);
      const la = L.opacity;
      // Porter-Duff source-over
      const oa = la + a * (1 - la);
      if (oa > 0) {
        r = (lr * la + r * a * (1 - la)) / oa;
        g = (lg * la + g * a * (1 - la)) / oa;
        b = (lb * la + b * a * (1 - la)) / oa;
      }
      a = oa;
    }
    if (a < 0.01) return null;
    return `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${a.toFixed(3)})`;
  }

  function setPixelOnLayer(x, y, color) {
    activeGrid()[y][x] = color;
    pixelEls[y][x].style.background = compositeAt(x, y) || '';
  }

  // ════════════════════════════════════════
  //  PALETTE + COLOR
  // ════════════════════════════════════════
  const PALETTE = [
    '#000000','#555555','#aaaaaa','#ffffff','#ff004d','#ff6c24',
    '#ffec27','#00e436','#29adff','#83769c','#ff77a8','#ffccaa',
    '#1d2b53','#7e2553','#ab5236','#5f574f','#008751','#2d1b69',
    '#742f29','#ff8426','#ffa300','#c2c3c7','#fff1e8','#131313',
  ];

  const paletteEl = document.getElementById('palette');
  PALETTE.forEach(color => {
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = color;
    if (color === currentColor) sw.classList.add('active');
    sw.addEventListener('click', () => setColor(color));
    paletteEl.appendChild(sw);
  });

  const colorPicker = document.getElementById('colorPicker');
  const colorPreview = document.getElementById('colorPreview');
  const colorHex = document.getElementById('colorHex');

  function setColor(c) {
    currentColor = c;
    colorPicker.value = c;
    colorPreview.style.background = c;
    colorHex.textContent = c.toUpperCase();
    const rgb = hexToRgb(c);
    document.querySelectorAll('.swatch').forEach(s => {
      s.classList.toggle('active', s.style.background === rgb);
    });
  }

  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgb(${r}, ${g}, ${b})`;
  }

  colorPicker.addEventListener('input', e => setColor(e.target.value));
  setColor(currentColor);

  // ════════════════════════════════════════
  //  TOOL SELECTION
  // ════════════════════════════════════════
  document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
    btn.addEventListener('click', () => selectTool(btn.dataset.tool));
  });

  function selectTool(tool) {
    currentTool = tool;
    document.querySelectorAll('.tool-btn[data-tool]').forEach(b =>
      b.classList.toggle('active', b.dataset.tool === tool));
    lineStart = null;
    rectStart = null;
    clearPreview();
  }

  // ════════════════════════════════════════
  //  DRAWING HELPERS
  // ════════════════════════════════════════
  function floodFill(x, y, target, fill) {
    if (target === fill) return;
    const g = activeGrid();
    const stack = [[x,y]];
    const visited = new Set();
    while (stack.length) {
      const [cx,cy] = stack.pop();
      const k = cx + ',' + cy;
      if (visited.has(k) || cx < 0 || cx >= GRID || cy < 0 || cy >= GRID) continue;
      if (g[cy][cx] !== target) continue;
      visited.add(k);
      setPixelOnLayer(cx, cy, fill);
      stack.push([cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]);
    }
  }

  function linePixels(x0,y0,x1,y1) {
    const pts = [];
    let dx = Math.abs(x1-x0), dy = Math.abs(y1-y0);
    let sx = x0<x1?1:-1, sy = y0<y1?1:-1, err = dx-dy;
    while (true) {
      pts.push([x0,y0]);
      if (x0===x1 && y0===y1) break;
      let e2 = 2*err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
    return pts;
  }

  function rectPixels(x0,y0,x1,y1) {
    const pts = [];
    const mnX=Math.min(x0,x1),mxX=Math.max(x0,x1),mnY=Math.min(y0,y1),mxY=Math.max(y0,y1);
    for (let x=mnX;x<=mxX;x++) { pts.push([x,mnY]); pts.push([x,mxY]); }
    for (let y=mnY+1;y<mxY;y++) { pts.push([mnX,y]); pts.push([mxX,y]); }
    return pts;
  }

  function clearPreview() {
    previewPixels.forEach(([x,y]) => {
      pixelEls[y][x].style.outline = '';
      pixelEls[y][x].style.outlineOffset = '';
    });
    previewPixels = [];
  }

  function showPreview(pts) {
    clearPreview();
    pts.forEach(([x,y]) => {
      if (x>=0 && x<GRID && y>=0 && y<GRID) {
        pixelEls[y][x].style.outline = `2px solid ${currentColor}`;
        pixelEls[y][x].style.outlineOffset = '-2px';
        previewPixels.push([x,y]);
      }
    });
  }

  // ════════════════════════════════════════
  //  MOUSE EVENTS
  // ════════════════════════════════════════
  canvasEl.addEventListener('mousedown', e => {
    const t = e.target;
    if (!t.classList.contains('pixel')) return;
    const x = +t.dataset.x, y = +t.dataset.y;

    if (currentTool === 'pen') {
      saveState(); isDrawing = true;
      setPixelOnLayer(x, y, currentColor);
    } else if (currentTool === 'eraser') {
      saveState(); isDrawing = true;
      setPixelOnLayer(x, y, null);
    } else if (currentTool === 'fill') {
      saveState();
      floodFill(x, y, activeGrid()[y][x], currentColor);
    } else if (currentTool === 'eyedropper') {
      const c = activeGrid()[y][x];
      if (c) setColor(c);
      showStatus('Picked ' + (c || 'empty'));
    } else if (currentTool === 'line') {
      if (!lineStart) { lineStart = [x,y]; showStatus('Click endpoint...'); }
      else {
        saveState();
        linePixels(lineStart[0],lineStart[1],x,y).forEach(([px,py]) => setPixelOnLayer(px,py,currentColor));
        lineStart = null; clearPreview();
      }
    } else if (currentTool === 'rect') {
      if (!rectStart) { rectStart = [x,y]; showStatus('Click opposite corner...'); }
      else {
        saveState();
        rectPixels(rectStart[0],rectStart[1],x,y).forEach(([px,py]) => setPixelOnLayer(px,py,currentColor));
        rectStart = null; clearPreview();
      }
    }
  });

  canvasEl.addEventListener('mousemove', e => {
    const t = e.target;
    if (!t.classList.contains('pixel')) return;
    const x = +t.dataset.x, y = +t.dataset.y;
    document.getElementById('coords').textContent = `${x}, ${y}`;
    if (isDrawing && currentTool === 'pen') setPixelOnLayer(x,y,currentColor);
    if (isDrawing && currentTool === 'eraser') setPixelOnLayer(x,y,null);
    if (currentTool === 'line' && lineStart) showPreview(linePixels(lineStart[0],lineStart[1],x,y));
    if (currentTool === 'rect' && rectStart) showPreview(rectPixels(rectStart[0],rectStart[1],x,y));
  });

  document.addEventListener('mouseup', () => { isDrawing = false; });

  // ════════════════════════════════════════
  //  BUTTONS: undo, redo, clear
  // ════════════════════════════════════════
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('redoBtn').addEventListener('click', redo);

  document.getElementById('clearBtn').addEventListener('click', () => {
    saveState();
    const g = activeGrid();
    for (let y=0;y<GRID;y++) for (let x=0;x<GRID;x++) g[y][x] = null;
    compositeAll();
    showStatus('Layer cleared');
  });

  // ════════════════════════════════════════
  //  GRID TOGGLE
  // ════════════════════════════════════════
  const gridToggle = document.getElementById('gridToggle');
  gridToggle.addEventListener('click', () => {
    gridToggle.classList.toggle('on');
    const show = gridToggle.classList.contains('on');
    document.querySelectorAll('.pixel').forEach(p => p.style.borderColor = show ? '' : 'transparent');
  });

  // ════════════════════════════════════════
  //  LAYER PANEL
  // ════════════════════════════════════════
  const thumbCvs = document.createElement('canvas');
  thumbCvs.width = GRID; thumbCvs.height = GRID;
  const thumbCtx = thumbCvs.getContext('2d');

  function layerThumb(layer) {
    thumbCtx.clearRect(0,0,GRID,GRID);
    for (let y=0;y<GRID;y++)
      for (let x=0;x<GRID;x++)
        if (layer.grid[y][x]) { thumbCtx.fillStyle = layer.grid[y][x]; thumbCtx.fillRect(x,y,1,1); }
    return thumbCvs.toDataURL();
  }

  function updateThumbnails() {
    layers.forEach(L => {
      const img = document.querySelector(`.layer-item[data-id="${L.id}"] .layer-thumb`);
      if (img) img.src = layerThumb(L);
    });
  }

  function renderLayerList() {
    const list = document.getElementById('layerList');
    list.innerHTML = '';

    layers.forEach((L, idx) => {
      const item = document.createElement('div');
      item.className = 'layer-item' + (L.id === activeLayerId ? ' active' : '');
      item.dataset.id = L.id;

      // Visibility
      const vis = document.createElement('button');
      vis.className = 'layer-visibility' + (L.visible ? '' : ' hidden');
      vis.textContent = L.visible ? '👁' : '–';
      vis.title = L.visible ? 'Hide' : 'Show';
      vis.addEventListener('click', e => {
        e.stopPropagation();
        saveState();
        L.visible = !L.visible;
        compositeAll();
        renderLayerList();
      });

      // Thumbnail
      const thumb = document.createElement('img');
      thumb.className = 'layer-thumb';
      thumb.src = layerThumb(L);

      // Name
      const nameIn = document.createElement('input');
      nameIn.className = 'layer-name';
      nameIn.value = L.name;
      nameIn.addEventListener('change', () => { L.name = nameIn.value; });
      nameIn.addEventListener('click', e => e.stopPropagation());

      // Reorder
      const orderDiv = document.createElement('div');
      orderDiv.className = 'layer-order-btns';

      const upBtn = document.createElement('button');
      upBtn.className = 'layer-order-btn';
      upBtn.textContent = '▲';
      upBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (idx > 0) { saveState(); [layers[idx-1],layers[idx]] = [layers[idx],layers[idx-1]]; compositeAll(); renderLayerList(); }
      });

      const dnBtn = document.createElement('button');
      dnBtn.className = 'layer-order-btn';
      dnBtn.textContent = '▼';
      dnBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (idx < layers.length-1) { saveState(); [layers[idx],layers[idx+1]] = [layers[idx+1],layers[idx]]; compositeAll(); renderLayerList(); }
      });

      orderDiv.appendChild(upBtn);
      orderDiv.appendChild(dnBtn);

      // Select on click
      item.addEventListener('click', () => {
        activeLayerId = L.id;
        renderLayerList();
        syncOpacity();
      });

      item.appendChild(vis);
      item.appendChild(thumb);
      item.appendChild(nameIn);
      item.appendChild(orderDiv);
      list.appendChild(item);
    });

    syncOpacity();
  }

  // Opacity slider
  const opSlider = document.getElementById('opacitySlider');
  const opValue = document.getElementById('opacityValue');

  function syncOpacity() {
    const L = activeLayer();
    if (!L) return;
    const pct = Math.round(L.opacity * 100);
    opSlider.value = pct;
    opValue.textContent = pct + '%';
  }

  opSlider.addEventListener('input', () => {
    const L = activeLayer();
    if (!L) return;
    L.opacity = opSlider.value / 100;
    opValue.textContent = opSlider.value + '%';
    compositeAll();
  });

  opSlider.addEventListener('mousedown', () => saveState());

  // ── Layer actions ──
  document.getElementById('addLayerBtn').addEventListener('click', () => {
    saveState();
    const nl = createLayer();
    layers.unshift(nl);
    activeLayerId = nl.id;
    renderLayerList();
    compositeAll();
    showStatus('Added ' + nl.name);
  });

  document.getElementById('dupeLayerBtn').addEventListener('click', () => {
    saveState();
    const src = activeLayer();
    const dup = createLayer(src.name + ' copy', src.grid.map(r => [...r]));
    dup.opacity = src.opacity;
    dup.visible = src.visible;
    const idx = layers.indexOf(src);
    layers.splice(idx, 0, dup);
    activeLayerId = dup.id;
    renderLayerList();
    compositeAll();
    showStatus('Duplicated');
  });

  document.getElementById('mergeLayerBtn').addEventListener('click', () => {
    const idx = layers.findIndex(l => l.id === activeLayerId);
    if (idx >= layers.length - 1) { showStatus('No layer below'); return; }
    saveState();
    const top = layers[idx], bot = layers[idx+1];
    for (let y=0;y<GRID;y++)
      for (let x=0;x<GRID;x++)
        if (top.grid[y][x] && top.visible) bot.grid[y][x] = top.grid[y][x];
    layers.splice(idx, 1);
    activeLayerId = bot.id;
    renderLayerList();
    compositeAll();
    showStatus('Merged down');
  });

  document.getElementById('deleteLayerBtn').addEventListener('click', () => {
    if (layers.length <= 1) { showStatus('Need at least one layer'); return; }
    saveState();
    const idx = layers.findIndex(l => l.id === activeLayerId);
    const name = layers[idx].name;
    layers.splice(idx, 1);
    activeLayerId = layers[Math.min(idx, layers.length-1)].id;
    renderLayerList();
    compositeAll();
    showStatus('Deleted ' + name);
  });

  // Initial
  renderLayerList();

  // ════════════════════════════════════════
  //  EXPORT — flatten all visible layers
  // ════════════════════════════════════════
  document.getElementById('exportBtn').addEventListener('click', () => {
    const cvs = document.createElement('canvas');
    cvs.width = GRID; cvs.height = GRID;
    const ctx = cvs.getContext('2d');

    // Bottom to top
    for (let i = layers.length-1; i >= 0; i--) {
      const L = layers[i];
      if (!L.visible) continue;
      ctx.globalAlpha = L.opacity;
      for (let y=0;y<GRID;y++)
        for (let x=0;x<GRID;x++)
          if (L.grid[y][x]) { ctx.fillStyle = L.grid[y][x]; ctx.fillRect(x,y,1,1); }
    }
    ctx.globalAlpha = 1;

    const name = document.getElementById('filename').value.trim() || 'sprite';
    const link = document.createElement('a');
    link.download = `${name}.png`;
    link.href = cvs.toDataURL('image/png');
    link.click();
    showStatus(`Exported ${name}.png`);
  });

  // ════════════════════════════════════════
  //  IMPORT — into active layer
  // ════════════════════════════════════════
  const importBtn = document.getElementById('importBtn');
  const importFile = document.getElementById('importFile');
  const dropZone = document.getElementById('dropZone');

  importBtn.addEventListener('click', () => importFile.click());
  dropZone.addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', e => { if (e.target.files[0]) loadImageFile(e.target.files[0]); });

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) loadImageFile(f);
    else showStatus('Not an image file');
  });

  canvasEl.addEventListener('dragover', e => e.preventDefault());
  canvasEl.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) loadImageFile(f);
  });

  function loadImageFile(file) {
    const reader = new FileReader();
    reader.onload = function(ev) {
      const img = new Image();
      img.onload = function() {
        importToLayer(img);
        document.getElementById('filename').value = file.name.replace(/\.[^.]+$/,'');
        showStatus(`Imported → "${activeLayer().name}"`);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function importToLayer(img) {
    saveState();
    const cvs = document.createElement('canvas');
    cvs.width = GRID; cvs.height = GRID;
    const ctx = cvs.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, 0, 0, GRID, GRID);
    const d = ctx.getImageData(0,0,GRID,GRID).data;
    const g = activeGrid();
    for (let y=0;y<GRID;y++)
      for (let x=0;x<GRID;x++) {
        const i = (y*GRID+x)*4;
        if (d[i+3] < 10) g[y][x] = null;
        else g[y][x] = '#' + [d[i],d[i+1],d[i+2]].map(v => v.toString(16).padStart(2,'0')).join('');
      }
    compositeAll();
    renderLayerList();
  }

  // ════════════════════════════════════════
  //  KEYBOARD SHORTCUTS
  // ════════════════════════════════════════
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if (k==='b') selectTool('pen');
    else if (k==='e') selectTool('eraser');
    else if (k==='g') selectTool('fill');
    else if (k==='i') selectTool('eyedropper');
    else if (k==='l') selectTool('line');
    else if (k==='r') selectTool('rect');
    else if (k==='z' && (e.ctrlKey||e.metaKey)) { e.preventDefault(); undo(); }
    else if (k==='y' && (e.ctrlKey||e.metaKey)) { e.preventDefault(); redo(); }
  });

  // ════════════════════════════════════════
  //  STATUS
  // ════════════════════════════════════════
  function showStatus(msg) {
    const el = document.getElementById('status');
    el.textContent = msg;
    setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 1500);
  }
</script>
</body>
</html>
