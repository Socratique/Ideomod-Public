<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Painter 16×16</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --accent2: #ff6b6b;
    --text: #eaeaea;
    --text-dim: #8892a4;
    --grid-line: rgba(255,255,255,0.08);
    --pixel-size: 28px;
    --border-glow: rgba(233, 69, 96, 0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    background-image:
      radial-gradient(circle at 20% 50%, rgba(233,69,96,0.05) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(15,52,96,0.3) 0%, transparent 50%);
  }

  h1 {
    font-family: 'Silkscreen', cursive;
    font-size: 28px;
    color: var(--accent);
    margin-bottom: 4px;
    text-shadow: 0 0 20px rgba(233,69,96,0.4);
    letter-spacing: 2px;
  }

  .subtitle {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 20px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .app {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* ── Toolbar ── */
  .toolbar {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 56px;
    align-items: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }

  .tool-btn {
    width: 38px;
    height: 38px;
    border: 2px solid transparent;
    border-radius: 8px;
    background: var(--surface2);
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    position: relative;
  }

  .tool-btn:hover {
    background: rgba(233,69,96,0.15);
    color: var(--text);
    transform: scale(1.05);
  }

  .tool-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(233,69,96,0.12);
    box-shadow: 0 0 12px rgba(233,69,96,0.2);
  }

  .tool-btn .tooltip {
    position: absolute;
    left: 48px;
    background: #222;
    color: #fff;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 10px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 10;
  }

  .tool-btn:hover .tooltip { opacity: 1; }

  .divider {
    width: 28px;
    height: 1px;
    background: rgba(255,255,255,0.08);
    margin: 4px 0;
  }

  /* ── Canvas Area ── */
  .canvas-wrap {
    position: relative;
  }

  .canvas-container {
    display: grid;
    grid-template-columns: repeat(16, var(--pixel-size));
    grid-template-rows: repeat(16, var(--pixel-size));
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 0 1px rgba(233,69,96,0.3);
    background: repeating-conic-gradient(#2a2a3e 0% 25%, #252538 0% 50%) 0 0 / calc(var(--pixel-size)*2) calc(var(--pixel-size)*2);
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
  }

  .pixel {
    width: var(--pixel-size);
    height: var(--pixel-size);
    border: 0.5px solid var(--grid-line);
    transition: none;
  }

  .pixel:hover {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    z-index: 1;
  }

  .canvas-coords {
    position: absolute;
    bottom: -22px;
    right: 0;
    font-size: 10px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── Right Panel ── */
  .panel {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 180px;
  }

  .panel-section {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }

  .panel-label {
    font-family: 'Silkscreen', cursive;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  /* Color Picker */
  .color-current {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .color-preview {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    border: 2px solid rgba(255,255,255,0.15);
    box-shadow: 0 0 8px rgba(0,0,0,0.3);
  }

  .color-hex {
    font-size: 12px;
    color: var(--text);
    font-weight: 600;
  }

  input[type="color"] {
    width: 100%;
    height: 32px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
    padding: 0;
  }

  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch {
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
  }

  /* Palette */
  .palette {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 3px;
  }

  .swatch {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 3px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s, border-color 0.1s;
  }

  .swatch:hover { transform: scale(1.15); z-index: 1; }
  .swatch.active { border-color: #fff; }

  /* Export */
  .export-section { display: flex; flex-direction: column; gap: 8px; }

  .filename-input {
    width: 100%;
    padding: 7px 10px;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    outline: none;
    transition: border-color 0.2s;
  }

  .filename-input:focus { border-color: var(--accent); }

  .export-btn {
    padding: 9px 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Silkscreen', cursive;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
  }

  .export-btn:hover {
    background: var(--accent2);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(233,69,96,0.35);
  }

  .import-btn {
    padding: 9px 12px;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    font-family: 'Silkscreen', cursive;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
    width: 100%;
  }

  .import-btn:hover {
    background: rgba(41,173,255,0.2);
    border-color: #29adff;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(41,173,255,0.2);
  }

  .drop-zone {
    border: 2px dashed rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    transition: all 0.2s;
    cursor: pointer;
  }

  .drop-zone.drag-over {
    border-color: #29adff;
    background: rgba(41,173,255,0.1);
    color: #29adff;
  }

  .size-info {
    font-size: 9px;
    color: var(--text-dim);
    text-align: center;
  }

  /* Grid toggle */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-dim);
  }

  .toggle {
    width: 34px;
    height: 18px;
    background: var(--bg);
    border-radius: 9px;
    cursor: pointer;
    position: relative;
    border: 1px solid rgba(255,255,255,0.1);
    transition: background 0.2s;
  }

  .toggle.on { background: var(--accent); border-color: var(--accent); }

  .toggle::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
    transition: left 0.15s;
  }

  .toggle.on::after { left: 18px; }

  /* Undo feedback */
  .status-bar {
    margin-top: 12px;
    font-size: 10px;
    color: var(--text-dim);
    text-align: center;
    min-height: 16px;
    letter-spacing: 1px;
  }

  /* Keyboard hints */
  .shortcuts {
    font-size: 9px;
    color: var(--text-dim);
    line-height: 1.8;
    opacity: 0.7;
  }

  .shortcuts kbd {
    background: var(--bg);
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.1);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
  }
</style>
</head>
<body>

<h1>PIXEL PAINTER</h1>
<p class="subtitle">16 × 16 editor</p>

<div class="app">
  <!-- Toolbar -->
  <div class="toolbar">
    <button class="tool-btn active" data-tool="pen" title="Pen">
      ✏️<span class="tooltip">Pen (B)</span>
    </button>
    <button class="tool-btn" data-tool="eraser" title="Eraser">
      🧹<span class="tooltip">Eraser (E)</span>
    </button>
    <button class="tool-btn" data-tool="fill" title="Fill">
      🪣<span class="tooltip">Fill (G)</span>
    </button>
    <button class="tool-btn" data-tool="eyedropper" title="Eyedropper">
      💧<span class="tooltip">Pick Color (I)</span>
    </button>
    <button class="tool-btn" data-tool="line" title="Line">
      📐<span class="tooltip">Line (L)</span>
    </button>
    <button class="tool-btn" data-tool="rect" title="Rectangle">
      ⬜<span class="tooltip">Rect (R)</span>
    </button>
    <div class="divider"></div>
    <button class="tool-btn" id="undoBtn" title="Undo">
      ↩️<span class="tooltip">Undo (Ctrl+Z)</span>
    </button>
    <button class="tool-btn" id="redoBtn" title="Redo">
      ↪️<span class="tooltip">Redo (Ctrl+Y)</span>
    </button>
    <div class="divider"></div>
    <button class="tool-btn" id="clearBtn" title="Clear">
      🗑️<span class="tooltip">Clear All</span>
    </button>
  </div>

  <!-- Canvas -->
  <div class="canvas-wrap">
    <div class="canvas-container" id="canvas"></div>
    <div class="canvas-coords" id="coords">—</div>
  </div>

  <!-- Right Panel -->
  <div class="panel">
    <!-- Color -->
    <div class="panel-section">
      <div class="panel-label">Color</div>
      <div class="color-current">
        <div class="color-preview" id="colorPreview"></div>
        <span class="color-hex" id="colorHex">#000000</span>
      </div>
      <input type="color" id="colorPicker" value="#000000">
    </div>

    <!-- Palette -->
    <div class="panel-section">
      <div class="panel-label">Palette</div>
      <div class="palette" id="palette"></div>
    </div>

    <!-- Settings -->
    <div class="panel-section">
      <div class="toggle-row">
        <span>Grid lines</span>
        <div class="toggle on" id="gridToggle"></div>
      </div>
    </div>

    <!-- Import -->
    <div class="panel-section export-section">
      <div class="panel-label">Import</div>
      <input type="file" id="importFile" accept="image/*" style="display:none">
      <button class="import-btn" id="importBtn">⬆ LOAD IMAGE</button>
      <div class="drop-zone" id="dropZone">or drag & drop here</div>
      <div class="size-info">Any image → sampled to 16×16</div>
    </div>

    <!-- Export -->
    <div class="panel-section export-section">
      <div class="panel-label">Export PNG</div>
      <input type="text" class="filename-input" id="filename" value="sprite" placeholder="filename">
      <button class="export-btn" id="exportBtn">⬇ DOWNLOAD</button>
      <div class="size-info">Exports as 16×16 PNG</div>
    </div>

    <!-- Shortcuts -->
    <div class="panel-section">
      <div class="panel-label">Keys</div>
      <div class="shortcuts">
        <kbd>B</kbd> Pen · <kbd>E</kbd> Eraser<br>
        <kbd>G</kbd> Fill · <kbd>I</kbd> Pick<br>
        <kbd>L</kbd> Line · <kbd>R</kbd> Rect<br>
        <kbd>Ctrl+Z</kbd> Undo<br>
        <kbd>Ctrl+Y</kbd> Redo
      </div>
    </div>
  </div>
</div>

<div class="status-bar" id="status"></div>

<script>
  // ── State ──
  const GRID = 16;
  let currentColor = '#000000';
  let currentTool = 'pen';
  let isDrawing = false;
  let grid = Array.from({length: GRID}, () => Array(GRID).fill(null));
  let undoStack = [];
  let redoStack = [];
  let lineStart = null; // for line tool
  let rectStart = null; // for rect tool
  let previewPixels = []; // for shape previews

  // ── Palette Colors ──
  const PALETTE = [
    '#000000','#555555','#aaaaaa','#ffffff','#ff004d','#ff6c24',
    '#ffec27','#00e436','#29adff','#83769c','#ff77a8','#ffccaa',
    '#1d2b53','#7e2553','#ab5236','#5f574f','#008751','#2d1b69',
    '#742f29','#ff8426','#ffa300','#c2c3c7','#fff1e8','#131313',
  ];

  // ── Init Canvas ──
  const canvas = document.getElementById('canvas');
  const pixels = [];

  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const div = document.createElement('div');
      div.className = 'pixel';
      div.dataset.x = x;
      div.dataset.y = y;
      canvas.appendChild(div);
      if (!pixels[y]) pixels[y] = [];
      pixels[y][x] = div;
    }
  }

  // ── Init Palette ──
  const paletteEl = document.getElementById('palette');
  PALETTE.forEach(color => {
    const swatch = document.createElement('div');
    swatch.className = 'swatch';
    swatch.style.background = color;
    if (color === currentColor) swatch.classList.add('active');
    swatch.addEventListener('click', () => setColor(color));
    paletteEl.appendChild(swatch);
  });

  // ── Color ──
  const colorPicker = document.getElementById('colorPicker');
  const colorPreview = document.getElementById('colorPreview');
  const colorHex = document.getElementById('colorHex');

  function setColor(c) {
    currentColor = c;
    colorPicker.value = c;
    colorPreview.style.background = c;
    colorHex.textContent = c.toUpperCase();
    document.querySelectorAll('.swatch').forEach(s => {
      s.classList.toggle('active', s.style.background === hexToRgbStr(c));
    });
  }

  function hexToRgbStr(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgb(${r}, ${g}, ${b})`;
  }

  colorPicker.addEventListener('input', e => setColor(e.target.value));
  setColor(currentColor);

  // ── Tools ──
  document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTool = btn.dataset.tool;
      document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      lineStart = null;
      rectStart = null;
      clearPreview();
    });
  });

  // ── Drawing ──
  function saveState() {
    undoStack.push(grid.map(row => [...row]));
    if (undoStack.length > 50) undoStack.shift();
    redoStack = [];
  }

  function setPixel(x, y, color) {
    grid[y][x] = color;
    pixels[y][x].style.background = color || '';
  }

  function getPixelColor(x, y) {
    return grid[y][x];
  }

  // Flood fill
  function floodFill(x, y, targetColor, fillColor) {
    if (targetColor === fillColor) return;
    const stack = [[x, y]];
    const visited = new Set();
    while (stack.length) {
      const [cx, cy] = stack.pop();
      const key = `${cx},${cy}`;
      if (visited.has(key)) continue;
      if (cx < 0 || cx >= GRID || cy < 0 || cy >= GRID) continue;
      if (grid[cy][cx] !== targetColor) continue;
      visited.add(key);
      setPixel(cx, cy, fillColor);
      stack.push([cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]);
    }
  }

  // Bresenham line
  function getLinePixels(x0, y0, x1, y1) {
    const pts = [];
    let dx = Math.abs(x1-x0), dy = Math.abs(y1-y0);
    let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;
    while (true) {
      pts.push([x0, y0]);
      if (x0 === x1 && y0 === y1) break;
      let e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
    return pts;
  }

  // Rectangle outline
  function getRectPixels(x0, y0, x1, y1) {
    const pts = [];
    const minX = Math.min(x0,x1), maxX = Math.max(x0,x1);
    const minY = Math.min(y0,y1), maxY = Math.max(y0,y1);
    for (let x = minX; x <= maxX; x++) { pts.push([x, minY]); pts.push([x, maxY]); }
    for (let y = minY+1; y < maxY; y++) { pts.push([minX, y]); pts.push([maxX, y]); }
    return pts;
  }

  // Preview overlay for shapes
  function clearPreview() {
    previewPixels.forEach(([x,y]) => {
      pixels[y][x].style.outline = '';
      pixels[y][x].style.outlineOffset = '';
    });
    previewPixels = [];
  }

  function showPreview(pts) {
    clearPreview();
    pts.forEach(([x,y]) => {
      if (x >= 0 && x < GRID && y >= 0 && y < GRID) {
        pixels[y][x].style.outline = `2px solid ${currentColor}`;
        pixels[y][x].style.outlineOffset = '-2px';
        previewPixels.push([x,y]);
      }
    });
  }

  // ── Mouse Events ──
  canvas.addEventListener('mousedown', e => {
    const t = e.target;
    if (!t.classList.contains('pixel')) return;
    const x = +t.dataset.x, y = +t.dataset.y;

    if (currentTool === 'pen') {
      saveState();
      isDrawing = true;
      setPixel(x, y, currentColor);
    } else if (currentTool === 'eraser') {
      saveState();
      isDrawing = true;
      setPixel(x, y, null);
    } else if (currentTool === 'fill') {
      saveState();
      floodFill(x, y, getPixelColor(x,y), currentColor);
    } else if (currentTool === 'eyedropper') {
      const c = getPixelColor(x, y);
      if (c) setColor(c);
      showStatus('Picked ' + (c || 'empty'));
    } else if (currentTool === 'line') {
      if (!lineStart) {
        lineStart = [x, y];
        showStatus('Click endpoint...');
      } else {
        saveState();
        getLinePixels(lineStart[0], lineStart[1], x, y).forEach(([px,py]) => setPixel(px, py, currentColor));
        lineStart = null;
        clearPreview();
      }
    } else if (currentTool === 'rect') {
      if (!rectStart) {
        rectStart = [x, y];
        showStatus('Click opposite corner...');
      } else {
        saveState();
        getRectPixels(rectStart[0], rectStart[1], x, y).forEach(([px,py]) => setPixel(px, py, currentColor));
        rectStart = null;
        clearPreview();
      }
    }
  });

  canvas.addEventListener('mousemove', e => {
    const t = e.target;
    if (!t.classList.contains('pixel')) return;
    const x = +t.dataset.x, y = +t.dataset.y;
    document.getElementById('coords').textContent = `${x}, ${y}`;

    if (isDrawing && currentTool === 'pen') setPixel(x, y, currentColor);
    if (isDrawing && currentTool === 'eraser') setPixel(x, y, null);

    // Live preview for line/rect
    if (currentTool === 'line' && lineStart) {
      showPreview(getLinePixels(lineStart[0], lineStart[1], x, y));
    }
    if (currentTool === 'rect' && rectStart) {
      showPreview(getRectPixels(rectStart[0], rectStart[1], x, y));
    }
  });

  document.addEventListener('mouseup', () => { isDrawing = false; });

  // ── Undo/Redo ──
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('redoBtn').addEventListener('click', redo);

  function undo() {
    if (!undoStack.length) return;
    redoStack.push(grid.map(row => [...row]));
    const state = undoStack.pop();
    restoreState(state);
    showStatus('Undo');
  }

  function redo() {
    if (!redoStack.length) return;
    undoStack.push(grid.map(row => [...row]));
    const state = redoStack.pop();
    restoreState(state);
    showStatus('Redo');
  }

  function restoreState(state) {
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++)
        setPixel(x, y, state[y][x]);
  }

  // ── Clear ──
  document.getElementById('clearBtn').addEventListener('click', () => {
    saveState();
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++)
        setPixel(x, y, null);
    showStatus('Cleared');
  });

  // ── Grid Toggle ──
  const gridToggle = document.getElementById('gridToggle');
  gridToggle.addEventListener('click', () => {
    gridToggle.classList.toggle('on');
    const show = gridToggle.classList.contains('on');
    document.querySelectorAll('.pixel').forEach(p => {
      p.style.borderColor = show ? '' : 'transparent';
    });
  });

  // ── Export PNG ──
  document.getElementById('exportBtn').addEventListener('click', () => {
    const offscreen = document.createElement('canvas');
    offscreen.width = GRID;
    offscreen.height = GRID;
    const ctx = offscreen.getContext('2d');

    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        if (grid[y][x]) {
          ctx.fillStyle = grid[y][x];
          ctx.fillRect(x, y, 1, 1);
        }
        // else leave transparent
      }
    }

    const name = document.getElementById('filename').value.trim() || 'sprite';
    const link = document.createElement('a');
    link.download = `${name}.png`;
    link.href = offscreen.toDataURL('image/png');
    link.click();
    showStatus(`Exported ${name}.png`);
  });

  // ── Import Image ──
  const importBtn = document.getElementById('importBtn');
  const importFile = document.getElementById('importFile');
  const dropZone = document.getElementById('dropZone');

  importBtn.addEventListener('click', () => importFile.click());
  dropZone.addEventListener('click', () => importFile.click());

  importFile.addEventListener('change', e => {
    if (e.target.files[0]) loadImageFile(e.target.files[0]);
  });

  // Drag and drop
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadImageFile(file);
    else showStatus('Not an image file');
  });

  // Also allow drop on entire canvas
  canvas.addEventListener('dragover', e => e.preventDefault());
  canvas.addEventListener('drop', e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadImageFile(file);
  });

  function loadImageFile(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        importImageToGrid(img);
        // Set filename from imported file (strip extension)
        const name = file.name.replace(/\.[^.]+$/, '');
        document.getElementById('filename').value = name;
        showStatus(`Imported "${file.name}"`);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function importImageToGrid(img) {
    saveState();
    // Draw image scaled to 16x16 on an offscreen canvas
    const offscreen = document.createElement('canvas');
    offscreen.width = GRID;
    offscreen.height = GRID;
    const ctx = offscreen.getContext('2d');
    ctx.imageSmoothingEnabled = false; // nearest-neighbor for pixel art
    ctx.clearRect(0, 0, GRID, GRID);
    ctx.drawImage(img, 0, 0, GRID, GRID);

    // Read pixel data
    const imageData = ctx.getImageData(0, 0, GRID, GRID);
    const data = imageData.data;

    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        const i = (y * GRID + x) * 4;
        const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
        if (a < 10) {
          // Treat near-transparent as empty
          setPixel(x, y, null);
        } else {
          const hex = '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
          setPixel(x, y, hex);
        }
      }
    }
  }

  // ── Keyboard Shortcuts ──
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const key = e.key.toLowerCase();
    if (key === 'b') selectTool('pen');
    else if (key === 'e') selectTool('eraser');
    else if (key === 'g') selectTool('fill');
    else if (key === 'i') selectTool('eyedropper');
    else if (key === 'l') selectTool('line');
    else if (key === 'r') selectTool('rect');
    else if (key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); }
    else if (key === 'y' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); redo(); }
  });

  function selectTool(tool) {
    currentTool = tool;
    document.querySelectorAll('.tool-btn[data-tool]').forEach(b => {
      b.classList.toggle('active', b.dataset.tool === tool);
    });
    lineStart = null;
    rectStart = null;
    clearPreview();
  }

  // ── Status ──
  function showStatus(msg) {
    const el = document.getElementById('status');
    el.textContent = msg;
    setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 1500);
  }
</script>
</body>
</html>
