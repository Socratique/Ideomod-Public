<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideomod Terrain Workbench</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Outfit:wght@300;400;600;700&display=swap');

  :root {
    --bg-primary: #0a0a0f;
    --bg-panel: #12121a;
    --bg-input: #1a1a25;
    --border: #2a2a3a;
    --text-primary: #e0e0e8;
    --text-secondary: #8888a0;
    --text-dim: #555568;
    --accent: #4a9eff;
    --accent-glow: #4a9eff40;
    --accent-hover: #6ab4ff;
    --warning: #ff9f43;
    --success: #2ed573;
    --danger: #ff4757;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #canvas-container {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0;
  }

  canvas { display: block; }

  /* Top bar */
  #topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 44px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    z-index: 10;
    gap: 16px;
  }

  #topbar .logo {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  #topbar .logo span {
    color: var(--text-dim);
    font-weight: 300;
  }

  #topbar .divider {
    width: 1px;
    height: 20px;
    background: var(--border);
  }

  .topbar-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  .topbar-info strong {
    color: var(--text-secondary);
  }

  /* Side panel */
  #panel {
    position: absolute;
    top: 44px;
    left: 0;
    bottom: 0;
    width: 280px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    z-index: 10;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  #panel::-webkit-scrollbar { width: 4px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .panel-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }

  .panel-section h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .control-row:last-child { margin-bottom: 0; }

  .control-row label {
    font-size: 12px;
    color: var(--text-secondary);
    flex-shrink: 0;
  }

  .control-row input[type="range"] {
    width: 100px;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--bg-input);
    border-radius: 2px;
    outline: none;
  }

  .control-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--bg-panel);
    box-shadow: 0 0 6px var(--accent-glow);
  }

  .control-row input[type="number"] {
    width: 60px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 4px 6px;
    text-align: right;
    outline: none;
  }

  .control-row input[type="number"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }

  .value-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    min-width: 36px;
    text-align: right;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-input);
    color: var(--text-primary);
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .btn:hover {
    background: var(--border);
    border-color: var(--text-dim);
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 600;
  }

  .btn-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  .btn + .btn { margin-top: 6px; }

  /* Toggle switch */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .toggle-row label {
    font-size: 12px;
    color: var(--text-secondary);
  }

  .toggle {
    position: relative;
    width: 36px;
    height: 20px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .toggle.active {
    background: var(--accent);
    border-color: var(--accent);
  }

  .toggle::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    background: var(--text-primary);
    border-radius: 50%;
    transition: transform 0.2s;
  }

  .toggle.active::after {
    transform: translateX(16px);
  }

  /* Loading overlay */
  #loading {
    position: absolute;
    top: 44px; left: 280px; right: 0; bottom: 0;
    background: var(--bg-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    transition: opacity 0.3s;
  }

  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #loading .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #loading p {
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-dim);
  }

  /* Coordinate display */
  #coords {
    position: absolute;
    bottom: 12px;
    left: 296px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--bg-panel);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 6px;
    z-index: 10;
    pointer-events: none;
  }

  /* Seed input special styling */
  .seed-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }

  .seed-row input {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 6px 8px;
    outline: none;
  }

  .seed-row input:focus {
    border-color: var(--accent);
  }

  .seed-row button {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-secondary);
    font-size: 14px;
    padding: 4px 8px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .seed-row button:hover {
    background: var(--border);
    color: var(--text-primary);
  }

  /* Help text */
  .help-text {
    font-size: 10px;
    color: var(--text-dim);
    font-style: italic;
    margin-top: 8px;
    line-height: 1.4;
  }

  /* Select */
  select {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 4px 6px;
    outline: none;
    cursor: pointer;
  }

  select:focus {
    border-color: var(--accent);
  }
</style>
</head>
<body>

<!-- Top Bar -->
<div id="topbar">
  <div class="logo">IDEOMOD <span>Terrain Workbench</span></div>
  <div class="divider"></div>
  <div class="topbar-info">Blocks: <strong id="info-blocks">0</strong></div>
  <div class="topbar-info">Faces: <strong id="info-faces">0</strong></div>
  <div class="topbar-info">Gen: <strong id="info-time">0ms</strong></div>
</div>

<!-- Side Panel -->
<div id="panel">
  <!-- Dimensions -->
  <div class="panel-section">
    <h3>Dimensions</h3>
    <div class="control-row">
      <label>Width (X)</label>
      <input type="number" id="dim-x" value="128" min="16" max="512" step="16">
    </div>
    <div class="control-row">
      <label>Length (Z)</label>
      <input type="number" id="dim-z" value="128" min="16" max="512" step="16">
    </div>
    <div class="control-row">
      <label>Min Y</label>
      <input type="number" id="dim-miny" value="-64" min="-64" max="0" step="8">
    </div>
    <div class="control-row">
      <label>Max Y</label>
      <input type="number" id="dim-maxy" value="192" min="64" max="320" step="8">
    </div>
  </div>

  <!-- Seed -->
  <div class="panel-section">
    <h3>World Seed</h3>
    <div class="seed-row">
      <input type="text" id="seed-input" value="12345" placeholder="Seed...">
      <button id="seed-random" title="Random seed">🎲</button>
    </div>
  </div>

  <!-- Base Terrain Noise -->
  <div class="panel-section">
    <h3>Base Terrain</h3>
    <div class="control-row">
      <label>Sea Level</label>
      <input type="number" id="sea-level" value="63" min="-64" max="192" step="1">
    </div>
    <div class="control-row">
      <label>Base Height</label>
      <input type="range" id="base-height" min="32" max="128" value="68" step="1">
      <span class="value-display" id="base-height-val">68</span>
    </div>
    <div class="control-row">
      <label>Height Variation</label>
      <input type="range" id="height-var" min="4" max="80" value="28" step="1">
      <span class="value-display" id="height-var-val">28</span>
    </div>
    <div class="control-row">
      <label>Noise Scale</label>
      <input type="range" id="noise-scale" min="1" max="100" value="35" step="1">
      <span class="value-display" id="noise-scale-val">0.035</span>
    </div>
    <div class="control-row">
      <label>Octaves</label>
      <input type="range" id="octaves" min="1" max="8" value="5" step="1">
      <span class="value-display" id="octaves-val">5</span>
    </div>
    <div class="control-row">
      <label>Lacunarity</label>
      <input type="range" id="lacunarity" min="10" max="40" value="20" step="1">
      <span class="value-display" id="lacunarity-val">2.0</span>
    </div>
    <div class="control-row">
      <label>Persistence</label>
      <input type="range" id="persistence" min="10" max="80" value="50" step="1">
      <span class="value-display" id="persistence-val">0.50</span>
    </div>
    <p class="help-text">Approximation of vanilla-like terrain. Tweak to get a recognizable base layer.</p>
  </div>

  <!-- Display -->
  <div class="panel-section">
    <h3>Display</h3>
    <div class="toggle-row">
      <label>Minecraft Colors</label>
      <div class="toggle active" id="toggle-mc-colors"></div>
    </div>
    <div class="toggle-row">
      <label>Show Water</label>
      <div class="toggle active" id="toggle-water"></div>
    </div>
    <div class="toggle-row">
      <label>Wireframe</label>
      <div class="toggle" id="toggle-wireframe"></div>
    </div>
    <div class="control-row">
      <label>Render</label>
      <select id="render-mode">
        <option value="surface">Surface Only</option>
        <option value="full">Full Voxels</option>
      </select>
    </div>
  </div>

  <!-- Actions -->
  <div class="panel-section">
    <button class="btn btn-primary" id="btn-generate">⚡ Generate Terrain</button>
    <button class="btn" id="btn-reset-camera">↺ Reset Camera</button>
  </div>
</div>

<!-- Loading Overlay -->
<div id="loading" class="hidden">
  <div class="spinner"></div>
  <p id="loading-text">Generating terrain...</p>
</div>

<!-- 3D Canvas Container -->
<div id="canvas-container"></div>

<!-- Coordinate Display -->
<div id="coords">Hover terrain to see coordinates</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// PERLIN NOISE IMPLEMENTATION
// Classic 2D Perlin noise, seeded, matching the general feel
// of how Minecraft uses multi-octave noise for terrain.
// ============================================================

class SeededPerlin {
  constructor(seed) {
    this.perm = new Uint8Array(512);
    this.seed(seed);
  }

  seed(s) {
    // Generate permutation table from seed
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    // Fisher-Yates shuffle with seed
    let n = this._hashSeed(s);
    for (let i = 255; i > 0; i--) {
      n = (n * 16807 + 0) & 0x7FFFFFFF;
      const j = n % (i + 1);
      [p[i], p[j]] = [p[j], p[i]];
    }
    for (let i = 0; i < 512; i++) this.perm[i] = p[i & 255];
  }

  _hashSeed(s) {
    if (typeof s === 'string') {
      let h = 0;
      for (let i = 0; i < s.length; i++) {
        h = ((h << 5) - h + s.charCodeAt(i)) | 0;
      }
      return Math.abs(h) || 1;
    }
    return Math.abs(Math.floor(s)) || 1;
  }

  _fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  _lerp(a, b, t) { return a + t * (b - a); }

  _grad(hash, x, y) {
    const h = hash & 7;
    const u = h < 4 ? x : y;
    const v = h < 4 ? y : x;
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  }

  noise2D(x, y) {
    const X = Math.floor(x) & 255;
    const Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x);
    const yf = y - Math.floor(y);
    const u = this._fade(xf);
    const v = this._fade(yf);
    const p = this.perm;
    const A = p[X] + Y;
    const B = p[X + 1] + Y;
    return this._lerp(
      this._lerp(this._grad(p[A], xf, yf), this._grad(p[B], xf - 1, yf), u),
      this._lerp(this._grad(p[A + 1], xf, yf - 1), this._grad(p[B + 1], xf - 1, yf - 1), u),
      v
    );
  }

  // Multi-octave fractal noise
  fbm(x, y, octaves, lacunarity, persistence) {
    let total = 0;
    let amplitude = 1;
    let frequency = 1;
    let maxVal = 0;
    for (let i = 0; i < octaves; i++) {
      total += this.noise2D(x * frequency, y * frequency) * amplitude;
      maxVal += amplitude;
      amplitude *= persistence;
      frequency *= lacunarity;
    }
    return total / maxVal;
  }
}

// ============================================================
// TERRAIN GENERATOR
// ============================================================

class TerrainGenerator {
  constructor() {
    this.perlin = new SeededPerlin(12345);
    // Second noise for continent-scale variation
    this.continentPerlin = new SeededPerlin(54321);
  }

  setSeed(seed) {
    this.perlin.seed(seed);
    // Derive a second seed for continent noise
    const seed2 = typeof seed === 'string'
      ? seed + '_continent'
      : seed * 16807 + 1;
    this.continentPerlin.seed(seed2);
  }

  /**
   * Generate a heightmap for the given area.
   * Returns a Float32Array of heights indexed by [x * sizeZ + z].
   */
  generateHeightmap(params) {
    const { sizeX, sizeZ, baseHeight, heightVariation, noiseScale,
            octaves, lacunarity, persistence } = params;

    const heightmap = new Float32Array(sizeX * sizeZ);
    // Offset so coords 0,0 is in the center of the generated area
    const halfX = sizeX / 2;
    const halfZ = sizeZ / 2;

    for (let x = 0; x < sizeX; x++) {
      for (let z = 0; z < sizeZ; z++) {
        const wx = (x - halfX);
        const wz = (z - halfZ);

        // Continent-scale noise (very low frequency) for broad hills/valleys
        const continent = this.continentPerlin.fbm(
          wx * noiseScale * 0.3,
          wz * noiseScale * 0.3,
          3, 2.0, 0.5
        );

        // Detail noise
        const detail = this.perlin.fbm(
          wx * noiseScale,
          wz * noiseScale,
          octaves, lacunarity, persistence
        );

        // Combine: continent shapes the broad form, detail adds texture
        const combined = continent * 0.6 + detail * 0.4;

        // Map to height
        const height = Math.round(baseHeight + combined * heightVariation);
        heightmap[x * sizeZ + z] = height;
      }
    }
    return heightmap;
  }
}

// ============================================================
// VOXEL MESH BUILDER (Greedy-ish face merging for performance)
// ============================================================

class VoxelMeshBuilder {
  /**
   * Build an optimized mesh from a heightmap.
   * Only creates visible faces (surface mode or full mode).
   */
  static build(heightmap, params, displayParams) {
    const { sizeX, sizeZ, minY, maxY, seaLevel } = params;
    const { mcColors, showWater, renderMode } = displayParams;

    const positions = [];
    const normals = [];
    const colors = [];
    const indices = [];
    let vertexCount = 0;
    let faceCount = 0;
    let blockCount = 0;

    const halfX = sizeX / 2;
    const halfZ = sizeZ / 2;

    // Block color function
    function getColor(y, surfaceY, isWater) {
      if (mcColors) {
        if (isWater) return [0.22, 0.45, 0.75]; // water blue
        if (y === surfaceY && surfaceY >= seaLevel) return [0.36, 0.63, 0.24]; // grass
        if (y >= surfaceY - 3) return [0.53, 0.38, 0.24]; // dirt
        if (y <= minY + 1) return [0.2, 0.2, 0.2]; // bedrock
        return [0.5, 0.5, 0.5]; // stone
      } else {
        // Height gradient
        if (isWater) return [0.15, 0.3, 0.6];
        const t = Math.max(0, Math.min(1, (y - minY) / (maxY - minY)));
        // Cool deep -> warm high gradient
        const r = 0.1 + t * 0.7;
        const g = 0.2 + t * 0.5 - Math.abs(t - 0.5) * 0.3;
        const b = 0.6 - t * 0.5;
        return [r, g, b];
      }
    }

    function addFace(x, y, z, nx, ny, nz, color) {
      // Offset positions so 0,0 is center
      const px = x - halfX;
      const pz = z - halfZ;

      // Define quad vertices based on normal direction
      let v0, v1, v2, v3;
      if (ny === 1) { // top
        v0 = [px, y+1, pz+1]; v1 = [px+1, y+1, pz+1]; v2 = [px+1, y+1, pz]; v3 = [px, y+1, pz];
      } else if (ny === -1) { // bottom
        v0 = [px, y, pz+1]; v1 = [px+1, y, pz+1]; v2 = [px+1, y, pz]; v3 = [px, y, pz];
      } else if (nx === 1) { // +x
        v0 = [px+1, y, pz]; v1 = [px+1, y+1, pz]; v2 = [px+1, y+1, pz+1]; v3 = [px+1, y, pz+1];
      } else if (nx === -1) { // -x
        v0 = [px, y, pz+1]; v1 = [px, y+1, pz+1]; v2 = [px, y+1, pz]; v3 = [px, y, pz];
      } else if (nz === 1) { // +z
        v0 = [px+1, y, pz+1]; v1 = [px+1, y+1, pz+1]; v2 = [px, y+1, pz+1]; v3 = [px, y, pz+1];
      } else { // -z
        v0 = [px, y, pz]; v1 = [px, y+1, pz]; v2 = [px+1, y+1, pz]; v3 = [px+1, y, pz];
      }

      for (const v of [v0, v1, v2, v3]) {
        positions.push(v[0], v[1], v[2]);
        normals.push(nx, ny, nz);
        colors.push(color[0], color[1], color[2]);
      }
      const i = vertexCount;
      indices.push(i, i+1, i+2, i, i+2, i+3);
      vertexCount += 4;
      faceCount++;
    }

    // Helper: get height at x,z (clamped)
    function getH(x, z) {
      if (x < 0 || x >= sizeX || z < 0 || z >= sizeZ) return minY;
      return heightmap[x * sizeZ + z];
    }

    // Generate faces
    for (let x = 0; x < sizeX; x++) {
      for (let z = 0; z < sizeZ; z++) {
        const surfaceY = heightmap[x * sizeZ + z];
        const startY = renderMode === 'surface' ? Math.max(minY, surfaceY - 4) : minY;
        const endY = surfaceY;

        // Solid blocks from startY to endY
        for (let y = startY; y <= endY; y++) {
          blockCount++;
          const color = getColor(y, surfaceY, false);

          // Check each face for exposure
          // Top face
          if (y === endY) {
            addFace(x, y, z, 0, 1, 0, color);
          }
          // Bottom face (only in full mode or at startY if surface)
          if (renderMode === 'full' && y === startY) {
            addFace(x, y, z, 0, -1, 0, color);
          }
          // +X face
          if (y > getH(x+1, z) || x === sizeX - 1) {
            addFace(x, y, z, 1, 0, 0, color);
          }
          // -X face
          if (y > getH(x-1, z) || x === 0) {
            addFace(x, y, z, -1, 0, 0, color);
          }
          // +Z face
          if (y > getH(x, z+1) || z === sizeZ - 1) {
            addFace(x, y, z, 0, 0, 1, color);
          }
          // -Z face
          if (y > getH(x, z-1) || z === 0) {
            addFace(x, y, z, 0, 0, -1, color);
          }
        }

        // Water
        if (showWater && surfaceY < seaLevel) {
          const waterColor = getColor(seaLevel, surfaceY, true);
          // Just the water surface face
          addFace(x, seaLevel, z, 0, 1, 0, waterColor);
          blockCount++;
        }
      }
    }

    return {
      positions: new Float32Array(positions),
      normals: new Float32Array(normals),
      colors: new Float32Array(colors),
      indices: new Uint32Array(indices),
      faceCount,
      blockCount
    };
  }
}

// ============================================================
// THREE.JS SCENE
// ============================================================

class TerrainViewer {
  constructor() {
    this.container = document.getElementById('canvas-container');
    this.generator = new TerrainGenerator();
    this.terrainMesh = null;
    this.heightmap = null;
    this.params = {};
    this.raycaster = new THREE.Raycaster();
    this.mouse = new THREE.Vector2();

    this.initScene();
    this.initControls();
    this.bindUI();
    this.animate();

    // Initial generation
    setTimeout(() => this.generate(), 100);
  }

  initScene() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x0a0a0f);
    // Fog for depth
    this.scene.fog = new THREE.FogExp2(0x0a0a0f, 0.003);

    // Camera
    this.camera = new THREE.PerspectiveCamera(
      60,
      (window.innerWidth - 280) / (window.innerHeight - 44),
      0.5,
      2000
    );
    this.camera.position.set(100, 120, 100);
    this.camera.lookAt(0, 40, 0);

    // Renderer
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(window.innerWidth - 280, window.innerHeight - 44);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.container.appendChild(this.renderer.domElement);
    this.renderer.domElement.style.position = 'absolute';
    this.renderer.domElement.style.top = '44px';
    this.renderer.domElement.style.left = '280px';

    // Lighting
    const ambient = new THREE.AmbientLight(0x404060, 0.6);
    this.scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffeedd, 1.0);
    sun.position.set(100, 200, 80);
    this.scene.add(sun);

    const fill = new THREE.DirectionalLight(0x8899bb, 0.3);
    fill.position.set(-60, 80, -40);
    this.scene.add(fill);

    // Grid helper at y=0 for reference
    const grid = new THREE.GridHelper(256, 16, 0x222233, 0x181822);
    grid.position.y = 0;
    this.scene.add(grid);
    this.grid = grid;

    // Axes helper (small)
    const axes = new THREE.AxesHelper(16);
    axes.position.set(0, 0, 0);
    this.scene.add(axes);

    // Resize handler
    window.addEventListener('resize', () => {
      const w = window.innerWidth - 280;
      const h = window.innerHeight - 44;
      this.camera.aspect = w / h;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(w, h);
    });

    // Mouse move for coordinates
    this.renderer.domElement.addEventListener('mousemove', (e) => {
      const rect = this.renderer.domElement.getBoundingClientRect();
      this.mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      this.mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    });
  }

  initControls() {
    // Simple orbit controls implementation
    // (since we can't import OrbitControls from r128 CDN)
    const canvas = this.renderer.domElement;
    this.orbit = {
      target: new THREE.Vector3(0, 40, 0),
      spherical: { radius: 170, phi: Math.PI / 3.5, theta: Math.PI / 4 },
      isDragging: false,
      isPanning: false,
      lastMouse: { x: 0, y: 0 }
    };

    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 0) this.orbit.isDragging = true; // left: rotate
      if (e.button === 2 || e.button === 1) this.orbit.isPanning = true; // right/middle: pan
      this.orbit.lastMouse = { x: e.clientX, y: e.clientY };
      e.preventDefault();
    });

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('mouseup', () => {
      this.orbit.isDragging = false;
      this.orbit.isPanning = false;
    });

    window.addEventListener('mousemove', (e) => {
      const dx = e.clientX - this.orbit.lastMouse.x;
      const dy = e.clientY - this.orbit.lastMouse.y;
      this.orbit.lastMouse = { x: e.clientX, y: e.clientY };

      if (this.orbit.isDragging) {
        this.orbit.spherical.theta -= dx * 0.005;
        this.orbit.spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1,
          this.orbit.spherical.phi - dy * 0.005));
      }

      if (this.orbit.isPanning) {
        const panSpeed = this.orbit.spherical.radius * 0.002;
        const right = new THREE.Vector3();
        const up = new THREE.Vector3(0, 1, 0);
        right.crossVectors(
          new THREE.Vector3().subVectors(this.camera.position, this.orbit.target).normalize(),
          up
        ).normalize();
        const panUp = new THREE.Vector3();
        panUp.crossVectors(right,
          new THREE.Vector3().subVectors(this.camera.position, this.orbit.target).normalize()
        ).normalize();
        this.orbit.target.addScaledVector(right, -dx * panSpeed);
        this.orbit.target.addScaledVector(panUp, dy * panSpeed);
      }
    });

    canvas.addEventListener('wheel', (e) => {
      this.orbit.spherical.radius *= (1 + e.deltaY * 0.001);
      this.orbit.spherical.radius = Math.max(10, Math.min(800, this.orbit.spherical.radius));
      e.preventDefault();
    }, { passive: false });
  }

  updateCamera() {
    const s = this.orbit.spherical;
    this.camera.position.set(
      s.radius * Math.sin(s.phi) * Math.cos(s.theta) + this.orbit.target.x,
      s.radius * Math.cos(s.phi) + this.orbit.target.y,
      s.radius * Math.sin(s.phi) * Math.sin(s.theta) + this.orbit.target.z
    );
    this.camera.lookAt(this.orbit.target);
  }

  resetCamera() {
    this.orbit.target.set(0, 40, 0);
    this.orbit.spherical = { radius: 170, phi: Math.PI / 3.5, theta: Math.PI / 4 };
  }

  bindUI() {
    // Slider value displays
    const sliders = [
      ['base-height', 'base-height-val', v => v],
      ['height-var', 'height-var-val', v => v],
      ['noise-scale', 'noise-scale-val', v => (v / 1000).toFixed(3)],
      ['octaves', 'octaves-val', v => v],
      ['lacunarity', 'lacunarity-val', v => (v / 10).toFixed(1)],
      ['persistence', 'persistence-val', v => (v / 100).toFixed(2)],
    ];

    for (const [id, valId, fmt] of sliders) {
      const el = document.getElementById(id);
      const valEl = document.getElementById(valId);
      el.addEventListener('input', () => {
        valEl.textContent = fmt(Number(el.value));
      });
    }

    // Toggles
    document.querySelectorAll('.toggle').forEach(el => {
      el.addEventListener('click', () => el.classList.toggle('active'));
    });

    // Buttons
    document.getElementById('btn-generate').addEventListener('click', () => this.generate());
    document.getElementById('btn-reset-camera').addEventListener('click', () => this.resetCamera());
    document.getElementById('seed-random').addEventListener('click', () => {
      document.getElementById('seed-input').value = Math.floor(Math.random() * 999999999);
    });

    // Enter key on seed triggers generation
    document.getElementById('seed-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') this.generate();
    });
  }

  getParams() {
    return {
      sizeX: Number(document.getElementById('dim-x').value),
      sizeZ: Number(document.getElementById('dim-z').value),
      minY: Number(document.getElementById('dim-miny').value),
      maxY: Number(document.getElementById('dim-maxy').value),
      seed: document.getElementById('seed-input').value,
      seaLevel: Number(document.getElementById('sea-level').value),
      baseHeight: Number(document.getElementById('base-height').value),
      heightVariation: Number(document.getElementById('height-var').value),
      noiseScale: Number(document.getElementById('noise-scale').value) / 1000,
      octaves: Number(document.getElementById('octaves').value),
      lacunarity: Number(document.getElementById('lacunarity').value) / 10,
      persistence: Number(document.getElementById('persistence').value) / 100,
    };
  }

  getDisplayParams() {
    return {
      mcColors: document.getElementById('toggle-mc-colors').classList.contains('active'),
      showWater: document.getElementById('toggle-water').classList.contains('active'),
      wireframe: document.getElementById('toggle-wireframe').classList.contains('active'),
      renderMode: document.getElementById('render-mode').value,
    };
  }

  generate() {
    const loading = document.getElementById('loading');
    loading.classList.remove('hidden');

    // Use requestAnimationFrame to let the loading UI paint before heavy work
    requestAnimationFrame(() => {
      setTimeout(() => {
        const startTime = performance.now();

        const params = this.getParams();
        const displayParams = this.getDisplayParams();
        this.params = params;

        // Set seed
        this.generator.setSeed(params.seed);

        // Generate heightmap
        this.heightmap = this.generator.generateHeightmap(params);

        // Build mesh
        const meshData = VoxelMeshBuilder.build(this.heightmap, params, displayParams);

        // Create Three.js geometry
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(meshData.positions, 3));
        geometry.setAttribute('normal', new THREE.BufferAttribute(meshData.normals, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(meshData.colors, 3));
        geometry.setIndex(new THREE.BufferAttribute(meshData.indices, 1));

        // Material
        const material = new THREE.MeshLambertMaterial({
          vertexColors: true,
          wireframe: displayParams.wireframe,
        });

        // Remove old mesh
        if (this.terrainMesh) {
          this.scene.remove(this.terrainMesh);
          this.terrainMesh.geometry.dispose();
          this.terrainMesh.material.dispose();
        }

        this.terrainMesh = new THREE.Mesh(geometry, material);
        this.scene.add(this.terrainMesh);

        // Update grid to match terrain size
        this.grid.scale.set(params.sizeX / 256, 1, params.sizeZ / 256);

        // Update info
        const elapsed = (performance.now() - startTime).toFixed(0);
        document.getElementById('info-blocks').textContent = meshData.blockCount.toLocaleString();
        document.getElementById('info-faces').textContent = meshData.faceCount.toLocaleString();
        document.getElementById('info-time').textContent = elapsed + 'ms';

        loading.classList.add('hidden');
      }, 30);
    });
  }

  updateCoords() {
    if (!this.terrainMesh || !this.heightmap) return;

    this.raycaster.setFromCamera(this.mouse, this.camera);
    const hits = this.raycaster.intersectObject(this.terrainMesh);
    const coordsEl = document.getElementById('coords');

    if (hits.length > 0) {
      const p = hits[0].point;
      // Convert back to block coordinates (account for centering offset)
      const bx = Math.floor(p.x);
      const by = Math.floor(p.y);
      const bz = Math.floor(p.z);
      coordsEl.textContent = `Block: ${bx}, ${by}, ${bz}`;
    } else {
      coordsEl.textContent = 'Hover terrain to see coordinates';
    }
  }

  animate() {
    requestAnimationFrame(() => this.animate());
    this.updateCamera();
    this.updateCoords();
    this.renderer.render(this.scene, this.camera);
  }
}

// ============================================================
// INIT
// ============================================================
const viewer = new TerrainViewer();
</script>
